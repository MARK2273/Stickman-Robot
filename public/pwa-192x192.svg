<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b" />
      <stop offset="100%" stop-color="#09090b" />
    </linearGradient>
    <linearGradient id="neon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="192" height="192" rx="36" fill="url(#bg)" stroke="#38bdf8" stroke-width="4" />

  <!-- Stickman Head & Body -->
  <circle cx="96" cy="52" r="18" fill="none" stroke="#f8fafc" stroke-width="7" />
  <circle cx="102" cy="50" r="3.5" fill="#38bdf8" filter="url(#glow)" />
  
  <!-- Cyber Visor Line -->
  <line x1="94" y1="50" x2="108" y2="50" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" />

  <!-- Torso -->
  <line x1="96" y1="70" x2="96" y2="120" stroke="#f8fafc" stroke-width="7" stroke-linecap="round" />

  <!-- Legs in Action Stance -->
  <line x1="96" y1="120" x2="72" y2="162" stroke="#f8fafc" stroke-width="7" stroke-linecap="round" />
  <line x1="96" y1="120" x2="122" y2="162" stroke="#f8fafc" stroke-width="7" stroke-linecap="round" />

  <!-- Dual Blaster Arms -->
  <line x1="96" y1="85" x2="135" y2="92" stroke="#f8fafc" stroke-width="7" stroke-linecap="round" />
  <line x1="96" y1="85" x2="62" y2="102" stroke="#f8fafc" stroke-width="6" stroke-linecap="round" />

  <!-- Heavy Sci-Fi Gun Barrel -->
  <rect x="130" y="84" width="28" height="14" rx="3" fill="#0284c7" stroke="#38bdf8" stroke-width="2" />
  <line x1="158" y1="91" x2="178" y2="91" stroke="#f43f5e" stroke-width="4" stroke-linecap="round" filter="url(#glow)" />

  <!-- Laser Muzzle Flash Spark -->
  <polygon points="178,91 184,86 182,91 188,91 183,95 186,100 180,94 176,96" fill="#fbbf24" />
</svg>
