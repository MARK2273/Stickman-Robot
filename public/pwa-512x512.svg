<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b" />
      <stop offset="50%" stop-color="#09090b" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <filter id="glow512" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Maskable Safe Background Canvas -->
  <rect width="512" height="512" fill="url(#bg512)" />

  <!-- Outer Neon Shield Ring -->
  <circle cx="256" cy="256" r="230" fill="none" stroke="url(#neonCyan)" stroke-width="8" opacity="0.4" stroke-dasharray="24 12" />

  <!-- Stickman Head & Cybernetic Visor -->
  <circle cx="256" cy="140" r="48" fill="none" stroke="#f8fafc" stroke-width="16" />
  <rect x="250" y="130" width="36" height="12" rx="6" fill="#38bdf8" filter="url(#glow512)" />

  <!-- Stickman Spine -->
  <line x1="256" y1="188" x2="256" y2="310" stroke="#f8fafc" stroke-width="16" stroke-linecap="round" />

  <!-- Combat Legs -->
  <line x1="256" y1="310" x2="190" y2="420" stroke="#f8fafc" stroke-width="16" stroke-linecap="round" />
  <line x1="256" y1="310" x2="330" y2="420" stroke="#f8fafc" stroke-width="16" stroke-linecap="round" />

  <!-- Left Guard Arm -->
  <line x1="256" y1="230" x2="170" y2="280" stroke="#f8fafc" stroke-width="14" stroke-linecap="round" />

  <!-- Right Gunner Arm Aiming Forward -->
  <line x1="256" y1="230" x2="360" y2="245" stroke="#f8fafc" stroke-width="16" stroke-linecap="round" />

  <!-- Heavy Assault Plasma Cannon -->
  <rect x="350" y="222" width="76" height="36" rx="8" fill="#0369a1" stroke="#38bdf8" stroke-width="5" />
  <rect x="375" y="210" width="28" height="12" rx="3" fill="#0284c7" />

  <!-- High Energy Plasma Laser Blast -->
  <line x1="426" y1="240" x2="480" y2="240" stroke="#f43f5e" stroke-width="12" stroke-linecap="round" filter="url(#glow512)" />
  <circle cx="482" cy="240" r="14" fill="#fbbf24" filter="url(#glow512)" />
</svg>
